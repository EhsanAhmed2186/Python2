{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h4">Reset your password</h1>
  <p>If an account matches the email, we’ll send a reset code.</p>
  <form method="post">
    {% csrf_token %}
    {% include "includes/form_fields.html" with form=form %}
    <button class="btn btn-primary w-100" type="submit">Send code</button>
  </form>
</div></div>
{% endblock %}
