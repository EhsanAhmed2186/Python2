{% extends "base.html" %}
{% block title %}Verify reset code{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h4">Enter your reset code</h1>
  <p>Code sent if an account exists for {{ email }}.</p>
  <form method="post">
    {% csrf_token %}
    {% include "includes/form_fields.html" with form=form %}
    <button class="btn btn-primary w-100" type="submit">Verify code</button>
  </form>
</div></div>
{% endblock %}
